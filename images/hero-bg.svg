<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.6" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Base gradient -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Glowing blurred circles -->
  <circle cx="320" cy="260" r="260" fill="#6366f1" opacity="0.55" filter="url(#blur)"/>
  <circle cx="1560" cy="220" r="220" fill="#06b6d4" opacity="0.45" filter="url(#blur)"/>
  <circle cx="1280" cy="880" r="300" fill="#8b5cf6" opacity="0.45" filter="url(#blur)"/>
  <circle cx="460" cy="940" r="200" fill="#06b6d4" opacity="0.3" filter="url(#blur)"/>

  <!-- Subtle dot grid -->
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- Decorative outlined shapes -->
  <circle cx="1620" cy="760" r="180" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="1620" cy="760" r="120" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="180" y="640" width="200" height="200" rx="40" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="2" transform="rotate(20 280 740)"/>
</svg>
